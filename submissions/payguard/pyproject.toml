[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db2: opt-in integration tests against real Docker Db2"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", ".venv-work", ".submission-work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
