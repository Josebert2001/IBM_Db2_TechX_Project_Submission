name: PayGuard checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests loadtest scripts
      - run: mypy src
      - run: pytest -q --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  db2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DB2_HOST: localhost
      DB2_PORT: '50000'
      DB2_DATABASE: PAYGUARD
      DB2_USER: db2inst1
      EMBED_PROVIDER: local
      GEMINI_API_KEY: ''
      PAYPAL_CLIENT_ID: ''
      PAYPAL_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Generate ephemeral database password
        shell: bash
        run: |
          db2_ci_password="$(openssl rand -hex 16)A1"
          echo "::add-mask::$db2_ci_password"
          echo "DB2_PASSWORD=$db2_ci_password" >> "$GITHUB_ENV"
      - run: docker compose up -d
      - name: Wait for Db2 (up to 20 minutes)
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            if docker logs payguard-db2 2>&1 | grep -q 'Setup has completed'; then exit 0; fi
            sleep 10
          done
          docker logs --tail 100 payguard-db2
          exit 1
      - run: python src/seed.py
      - run: pytest --db2 -q -m db2 --junitxml=db2-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db2-results
          path: db2-tests.xml
      - run: docker compose down
        if: always()
